name: Sandbox Flutter Offline Bundle

on:
  push:
    paths:
      - '.github/workflows/sandbox-flutter-offline-bundle.yml'

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: '3.47.5'
      FLUTTER_SHA256: '2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb'
      GRADLE_USER_HOME: /tmp/gradle-home
      PUB_CACHE: /tmp/pub-cache
    steps:
      - name: Download Flutter SDK
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2             "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"             -o /tmp/flutter.tar.xz
          echo "${FLUTTER_SHA256}  /tmp/flutter.tar.xz" | sha256sum -c -
          mkdir -p /tmp/flutter-sdk
          tar -xJf /tmp/flutter.tar.xz -C /tmp/flutter-sdk
          echo "/tmp/flutter-sdk/flutter/bin" >> "$GITHUB_PATH"

      - name: Warm Flutter and Android build caches
        run: |
          set -euxo pipefail
          export PATH="/tmp/flutter-sdk/flutter/bin:$PATH"
          flutter --version
          flutter config --no-analytics
          flutter create --platforms=android --org com.sandbox --project-name warmup /tmp/warmup
          cd /tmp/warmup
          flutter build apk --release
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Package compact Android and Gradle offline bundle
        run: |
          set -euxo pipefail
          mkdir -p /tmp/offline/android-sdk/platforms /tmp/offline/android-sdk/build-tools
          cp -a "$ANDROID_HOME/platforms/android-36" /tmp/offline/android-sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/36.0.0" /tmp/offline/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platform-tools" /tmp/offline/android-sdk/
          cp -a "$ANDROID_HOME/licenses" /tmp/offline/android-sdk/
          cp -a /tmp/gradle-home /tmp/offline/
          cp -a /tmp/pub-cache /tmp/offline/
          cp -a /tmp/warmup /tmp/offline/warmup
          tar -I 'zstd -7 -T0' -cf /tmp/android-gradle-offline.tar.zst -C /tmp/offline .
          split -b 350M /tmp/android-gradle-offline.tar.zst /tmp/deps-part-
          split -b 400M /tmp/flutter.tar.xz /tmp/flutter-part-
          ls -lh /tmp/flutter-part-* /tmp/deps-part-*

      - name: Upload Flutter part aa
        uses: actions/upload-artifact@v4
        with:
          name: flutter-part-aa
          path: /tmp/flutter-part-aa
          compression-level: 0
      - name: Upload Flutter part ab
        uses: actions/upload-artifact@v4
        with:
          name: flutter-part-ab
          path: /tmp/flutter-part-ab
          compression-level: 0
      - name: Upload Flutter part ac
        uses: actions/upload-artifact@v4
        with:
          name: flutter-part-ac
          path: /tmp/flutter-part-ac
          compression-level: 0
      - name: Upload Flutter part ad
        uses: actions/upload-artifact@v4
        with:
          name: flutter-part-ad
          path: /tmp/flutter-part-ad
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload Flutter part ae
        uses: actions/upload-artifact@v4
        with:
          name: flutter-part-ae
          path: /tmp/flutter-part-ae
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload deps part aa
        uses: actions/upload-artifact@v4
        with:
          name: deps-part-aa
          path: /tmp/deps-part-aa
          compression-level: 0
      - name: Upload deps part ab
        uses: actions/upload-artifact@v4
        with:
          name: deps-part-ab
          path: /tmp/deps-part-ab
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload deps part ac
        uses: actions/upload-artifact@v4
        with:
          name: deps-part-ac
          path: /tmp/deps-part-ac
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload deps part ad
        uses: actions/upload-artifact@v4
        with:
          name: deps-part-ad
          path: /tmp/deps-part-ad
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload deps part ae
        uses: actions/upload-artifact@v4
        with:
          name: deps-part-ae
          path: /tmp/deps-part-ae
          compression-level: 0
          if-no-files-found: ignore
