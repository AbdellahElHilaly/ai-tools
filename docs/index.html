<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3a86ff" />
    <meta name="description" content="Simple AI tools for learning and focused work." />
    <link rel="icon" href="./icon.svg" />
    <link rel="manifest" href="/ai-tools/manifest.webmanifest" />
    <title>AI Tools</title>
    <style>
      html,body,#root{min-height:100%;margin:0}
      body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#fbfbff;color:#20243a}
      .boot-status{display:grid;min-height:100vh;place-items:center;margin:0;color:#70768a;font-size:.9rem}
      .boot-error{max-width:28rem;margin:18vh auto;padding:1.2rem;text-align:center}
      .boot-error button{min-height:2.75rem;padding:0 1rem;border:0;border-radius:14px;color:#087b82;background:linear-gradient(120deg,rgba(102,224,255,.28),rgba(217,167,255,.2));font:inherit;font-weight:750}
    </style>
    <script type="module" src="/ai-tools/bootstrap.js"></script>
  </head>
  <body>
    <div id="root"><p class="boot-status">Opening AI Tools…</p></div>
  </body>
</html>
